name: Verify three Hobby projects
on: [push, pull_request]
permissions:
  contents: read
jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_hobby_bundle.py
      - run: npm ci && npm test && npm run build
        working-directory: apps/platform
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [agent-api, engineering]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.vercel -t engineering-check .
        working-directory: apps/${{ matrix.project }}
      - if: matrix.project == 'engineering'
        run: docker run --rm engineering-check python scripts/cloud_native_smoke.py
